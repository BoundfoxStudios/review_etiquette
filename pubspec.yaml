name: review_etiquette
description: Asks for an in-app review at the right moment, after your app delivered value instead of on launch, following the Apple and Google rules.
version: 1.0.0
repository: https://github.com/BoundfoxStudios/review_etiquette
issue_tracker: https://github.com/BoundfoxStudios/review_etiquette/issues
topics:
  - in-app-review
  - rating
  - review
  - storekit
  - play-store

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  # Not used by hand written code: the generated pigeon output imports it, and
  # pub publish rejects an undeclared import even though the analyzer, which
  # skips *.g.dart, never sees it.
  meta: ^1.18.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^28.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  plugin:
    platforms:
      android:
        package: com.boundfoxstudios.review_etiquette
        pluginClass: ReviewEtiquettePlugin
      ios:
        pluginClass: ReviewEtiquettePlugin
