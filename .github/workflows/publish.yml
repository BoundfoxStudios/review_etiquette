name: Publish to pub.dev

on:
  push:
    tags:
      # Must match the tag pattern configured on pub.dev's admin page, and the
      # tag release-please produces with include-component-in-tag: false.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      # Without this, setup-dart never requests an OIDC token and the job fails
      # at authentication rather than at a missing permission.
      id-token: write
    # An exact tag, not the floating `v1`: that major tag still sits on v1.7.2
    # and misses the newer pins in the reusable workflow. Bump it by hand until
    # dart-lang/setup-dart#191 is fixed.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.0
