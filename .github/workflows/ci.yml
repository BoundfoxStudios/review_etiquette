name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .fvmrc; the two are not wired together.
  FLUTTER_VERSION: 3.47.1

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check the pigeon output is in step with its input
        run: |
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code -- lib/src ios android

  podspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Parse the podspec and check both ios floors agree
        run: |
          gem install --no-document cocoapods-core
          ruby -e '
            require "cocoapods-core"
            spec = Pod::Spec.from_file("ios/review_etiquette.podspec")
            linter = Pod::Specification::Linter.new(spec)
            linter.lint
            errors = linter.results.select { |result| result.type == :error }
            linter.results.each { |result| puts "#{result.type}: #{result.message}" }
            abort("podspec has errors") unless errors.empty?

            podspec_ios = spec.deployment_target(:ios)
            package_ios = File.read("ios/review_etiquette/Package.swift")[/\.iOS\("([\d.]+)"\)/, 1]
            unless podspec_ios == package_ios
              abort("deployment target drifted: podspec #{podspec_ios}, Package.swift #{package_ios}")
            end

            spec.attributes_hash["resource_bundles"].each_value do |paths|
              Array(paths).each do |path|
                abort("resource_bundles points at nothing: #{path}") unless File.exist?(File.join("ios", path))
              end
            end
          '

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle.kts', 'example/android/**/*.gradle*') }}
          restore-keys: gradle-

      - run: flutter pub get
      - run: flutter build apk --config-only
        working-directory: example
      - run: ./gradlew :review_etiquette:test
        working-directory: example/android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Catches a drift of the example's own deployment target below the
      # plugin's 16.0, which fails at swift package resolution rather than at
      # compile time and is otherwise only visible on a developer machine.
      - name: Configure the example for iOS
        run: flutter build ios --config-only --no-codesign
        working-directory: example

      # --quick is required, not politeness: without it the lint resolves the
      # `Flutter` dependency against the stale trunk pod.
      - name: Lint the podspec
        run: pod lib lint ios/review_etiquette.podspec --quick --allow-warnings

      - name: Run the Swift suite
        working-directory: example/ios
        run: |
          # Picked at run time rather than hardcoded: the runner image rotates
          # which simulators exist, and naming a missing one fails with exit 70.
          simulator=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$simulator" ] || [ "$simulator" = "null" ]; then
            echo "No iPhone simulator is available on this runner."
            exit 1
          fi
          echo "Using simulator $simulator"

          # The `|| status=$?` matters: these steps run under `set -e`, so a
          # bare call would abort before the exit code below is inspected.
          status=0
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$simulator" \
            CODE_SIGNING_ALLOWED=NO || status=$?

          # 66 means xcodebuild found no tests at all, which otherwise passes
          # for a target that was never added to the scheme.
          if [ "$status" -eq 66 ]; then
            echo "xcodebuild found no tests"
            exit 1
          fi
          exit "$status"

  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart pub global activate pana
      - name: Score with pana
        run: dart pub global run pana --no-warning --exit-code-threshold 0
      - run: flutter pub publish --dry-run
